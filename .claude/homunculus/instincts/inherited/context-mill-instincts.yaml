# Context Mill Workflow Add Or Update Skill

## Action

Follow the add-or-update-skill workflow:
1. Create or update 'transformation-config/skills/<skill-name>/config.yaml'
2. Create or update 'transformation-config/skills/<skill-name>/description.md'
3. Create or update reference markdown files under 'transformation-config/skills/<skill-name>/references/'

## Evidence

- Workflow detected from commit patterns
- Frequency: ~2x per month
- Files: transformation-config/skills/*/config.yaml, transformation-config/skills/*/description.md, transformation-config/skills/*/references/*.md

