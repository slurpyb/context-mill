# External skill sources
#
# Skills built here come from three places:
#   1. transformation-config/skills/**  — native skill groups (config.yaml + variants)
#   2. prebuilt                          — a directory that already contains a
#                                          SKILL.md (+ optional references/),
#                                          e.g. the output of Skill_Seekers
#                                          (github.com/yusufkaraaslan/Skill_Seekers)
#   3. ocx_profiles                      — an ocx project directory
#                                          (github.com/kdcokenny/ocx). `ocx add`
#                                          installs skills to
#                                          <project>/.opencode/skills/<name>/,
#                                          already in Claude (SKILL.md) format.
#                                          Point `path` at the project root (or
#                                          its .opencode/ or .opencode/skills/)
#                                          and every skill there is imported.
#
# A folder is treated as a skill iff it contains a SKILL.md. Paths may be
# absolute, "~"-prefixed, or relative to the repo root.

prebuilt: []
#  - path: ../skill-seekers/output/godot   # dir containing SKILL.md (+ references/)
#    group: imported                       # manifest category / plugin group
#    id: godot                             # optional; defaults to the SKILL.md name, then the dir name
#    tags: [godot, gamedev]                # optional; merged with SKILL.md frontmatter tags

ocx_profiles: []
#  - path: ~/projects/my-app          # ocx project root; reads <root>/.opencode/skills/*
#    group: ocx                        # manifest category / plugin group
#    tags: [ocx]                       # optional; applied to every imported skill
